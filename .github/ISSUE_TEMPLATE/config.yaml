blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/vela-tools/libra/security/policy
    about: Never open a public issue for a vulnerability. Follow the responsible disclosure process in the Libra security policy.
  - name: Report a bug in Libra itself
    url: https://github.com/vela-tools/libra/issues/new/choose
    about: A request allowed that should have been refused, a crash, or a missing feature belongs in the main repository, not here.
  - name: Contact Vela Tools
    url: https://velacontext.com/contactus
    about: Commercial enquiries, or anything else that should not be discussed in a public issue.
